<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>منطقة الذكاء الاصطناعي والمكافآت</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background-color: #0f172a;
      color: #ffffff;
      text-align: center;
      padding: 20px;
      margin: 0;
    }
    .card {
      background-color: #1e293b;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.3);
      margin-top: 20px;
    }
    .ad-container {
      min-height: 150px;
      border: 2px dashed #38bdf8;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 10px;
      margin-top: 15px;
      background-color: #0f172a;
    }
    .btn {
      background-color: #22c55e;
      color: white;
      border: none;
      padding: 12px 24px;
      font-size: 16px;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
      width: 100%;
      margin-top: 20px;
    }
  </style>
</head>
<body>

  <div class="card">
    <h2>🤖 لوحة تحكم الذكاء الاصطناعي</h2>
    <p>يرجى البقاء في هذه الصفحة أثناء استكمال معالجة طلباتك والعروض الإعلانية...</p>

    <!-- حاوية الإعلانات المتدورة -->
    <div id="ad-box" class="ad-container">
      <span>جاري تحميل العروض الإعلانية...</span>
    </div>

    <button class="btn" onclick="Telegram.WebApp.close()">العودة للمحادثة في البوت</button>
  </div>

  <script>
    Telegram.WebApp.ready();

    // ضع هنا أكواد الـ 5 وحدات إعلانية (Social Bar) الخاصة بك من Adsterra بالترتيب
    const adUnits = [
      `<!-- وحدة إعلانية 1 --> <script type="text/javascript" src="//plX1.g00gfe.com/xx/yy/zz.js"><\/script>`,
      `<!-- وحدة إعلانية 2 --> <script type="text/javascript" src="//plX2.g00gfe.com/xx/yy/zz.js"><\/script>`,
      `<!-- وحدة إعلانية 3 --> <script type="text/javascript" src="//plX3.g00gfe.com/xx/yy/zz.js"><\/script>`,
      `<!-- وحدة إعلانية 4 --> <script type="text/javascript" src="//plX4.g00gfe.com/xx/yy/zz.js"><\/script>`,
      `<!-- وحدة إعلانية 5 --> <script type="text/javascript" src="//plX5.g00gfe.com/xx/yy/zz.js"><\/script>`
    ];

    let currentAdIndex = 0;

    function rotateAd() {
      const adBox = document.getElementById('ad-box');
      adBox.innerHTML = '';
      const scriptContainer = document.createElement('div');
      scriptContainer.innerHTML = adUnits[currentAdIndex];
      adBox.appendChild(scriptContainer);
      
      // التبديل للوحدة التالية تدويرياً (من 0 إلى 4 ثم يعود للصفر)
      currentAdIndex = (currentAdIndex + 1) % adUnits.length;
    }

    // تشغيل أول إعلان فور فتح الصفحة
    rotateAd();

    // تدوير الإعلان تلقائياً كل 30 ثانية (30000 ميلي ثانية)
    setInterval(rotateAd, 30000);
  </script>

</body>
</html>
