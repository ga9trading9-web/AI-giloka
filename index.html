<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>منطقة الذكاء الاصطناعي والمكافآت</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background-color: #0f172a;
      color: #ffffff;
      text-align: center;
      padding: 20px;
      margin: 0;
    }
    .card {
      background-color: #1e293b;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.3);
      margin-top: 20px;
    }
    .ad-container {
      min-height: 150px;
      border: 2px dashed #38bdf8;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 10px;
      margin-top: 15px;
      background-color: #0f172a;
    }
    .btn {
      background-color: #22c55e;
      color: white;
      border: none;
      padding: 12px 24px;
      font-size: 16px;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
      width: 100%;
      margin-top: 20px;
    }
  </style>
</head>
<body>

  <div class="card">
    <h2>🤖 لوحة تحكم الذكاء الاصطناعي</h2>
    <p>يرجى البقاء في هذه الصفحة أثناء استكمال معالجة طلباتك والعروض الإعلانية...</p>

    <!-- حاوية الإعلانات المتدورة -->
    <div id="ad-box" class="ad-container">
      <span>جاري تحميل العروض الإعلانية...</span>
    </div>

    <button class="btn" onclick="Telegram.WebApp.close()">العودة للمحادثة في البوت</button>
  </div>

  <script>
    Telegram.WebApp.ready();

    // وحدات الإعلانات الـ 5 مدمجة بالترتيب
    const adUnits = [
      `<script data-cfasync="false" src="https://bicea.org/14/df2d6a7eb967d39f43aedcba2e7025e3"><\/script>`,
      `<script data-cfasync="false" src="https://bicea.org/14/a02258ff6bde5d79eabd354c6b6ae4fe"><\/script>`,
      `<script data-cfasync="false" src="https://bicea.org/14/7573af3fb12c404e7b67ab37d9ee79ef"><\/script>`,
      `<script data-cfasync="false" src="https://bicea.org/14/4cc54663ad5835e4c0629ed1e2306172"><\/script>`,
      `<script data-cfasync="false" src="https://bicea.org/14/f4e4d48ae9525c9596eb6c2f32c5d030"><\/script>`
    ];

    let currentAdIndex = 0;

    function rotateAd() {
      const adBox = document.getElementById('ad-box');
      adBox.innerHTML = '';
      const scriptContainer = document.createElement('div');
      scriptContainer.innerHTML = adUnits[currentAdIndex];
      adBox.appendChild(scriptContainer);
      
      // التبديل للوحدة التالية تدويرياً كل 30 ثانية
      currentAdIndex = (currentAdIndex + 1) % adUnits.length;
    }

    // تشغيل أول إعلان فور فتح الصفحة
    rotateAd();

    // تدوير الإعلانات تلقائياً كل 30 ثانية
    setInterval(rotateAd, 30000);
  </script>

</body>
</html>
